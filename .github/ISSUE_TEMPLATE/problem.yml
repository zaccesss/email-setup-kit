name: Something is wrong
description: A guide step, the signature builder, the filters or the template builder does not work
title: "fix: "
labels: ["bug"]
body:
  - type: input
    id: where
    attributes:
      label: Where
      placeholder: "e.g. guide/02-deliverability.md, the signature builder, build_oft.py"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Mail service, browser or Python version"
  - type: dropdown
    id: ai-use
    attributes:
      label: AI use
      description: "Required. Did AI help you find, test or check this? Write the title and description yourself either way. See the [AI policy](https://github.com/zaccesss/ai-policy). Dictation, translation and spelling tools do not count."
      options:
        - No AI was used
        - "Yes: AI helped me find, test or check it"
    validations:
      required: true
