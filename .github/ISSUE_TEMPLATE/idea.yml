name: Idea or addition
description: A new guide section, gotcha, template or builder improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What you would like added
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it helps
  - type: dropdown
    id: ai-use
    attributes:
      label: AI use
      description: "Required. Did AI help you find, test or check this? Write the title and description yourself either way. See the [AI policy](https://github.com/zaccesss/ai-policy). Dictation, translation and spelling tools do not count."
      options:
        - No AI was used
        - "Yes: AI helped me find, test or check it"
    validations:
      required: true
